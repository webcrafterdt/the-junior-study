<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="teacherhome"></ion-back-button>
    </ion-buttons>
    <ion-title>Assign HomeWork</ion-title>
  </ion-toolbar>

  <ion-segment [(ngModel)]="category" style="background-color:#e4f3f7!important">
    <ion-segment-button value="applicationlist" style="border:none;color:black;font-size:12px"
      (click)="applied_leaves()">
      HOMEWORKS
    </ion-segment-button>
    <ion-segment-button value="writeapplication" style="border:none;color:black;font-size:12px">
      Applied HomeWork
    </ion-segment-button>

  </ion-segment>
</ion-header>

<ion-content [style.--background]="'#eceff8'">
  <div style="background-color: #eceff8;">


    <div [ngSwitch]="category" style="background-color:#e4f3f7;">
      <ion-list *ngSwitchCase="'applicationlist'" style="background-color: #eceff8;">
    <ng-container *ngIf="this.status == true">
      <ion-row class="custom-rowheader">
        <ion-col size="9" class="text-column">
          <p class="text">Classes</p>
        </ion-col>
        <ion-col size="3" class="amount-column">
          <p class="amount">&nbsp;</p>
        </ion-col>
      </ion-row>

      <ng-container *ngFor="let classdata of this.HomeworkClasses">
        <ion-row class="custom-row" >
          <ion-col size="8" class="text-column">
            <p class="text">{{classdata.classname}}</p>
          </ion-col>
          <ion-col size="3" class="amount-column" style="justify-content: right!important;">
            <p class="amount">&nbsp;</p>
          </ion-col>
          <ion-col size="1" class="amount-column">
            <!-- <ion-icon name="chevron-forward-outline" style="color: gray;"></ion-icon> -->
            <ion-checkbox class="custom-checkbox" name="transid" style="height: 15px;width: 15px;" (click)="gettransids(classdata.transid)"></ion-checkbox>
             

          </ion-col>
        </ion-row>
      </ng-container>

      <ion-list style="background-color: #eceff8;">

        <ion-button color="linear-gradient(#007ab3, #055073)" style="color: white;background-color: #eceff8;"  expand="block" size="large" class="addbutton" type="submit"
          expand="block" (click)="ProceedToSubject()">PROCEED &nbsp;<ion-icon
            name="add-circle-outline"></ion-icon></ion-button>
        </ion-list>
    </ng-container>
  </ion-list>



    <ion-list *ngSwitchCase="'writeapplication'" style="background-color: #eceff8;">
      <ng-container>
          <ng-container>
            <ion-row class="custom-row" *ngFor="let homework of homeworklist; let i = index">
              <ion-col size="12">
                <div style="width: 100%;height: 100%;" >  

                  <div style="border-top-left-radius: 12px;
       border-bottom-left-radius: 12px;width: 6%;float: left;background-color: #F1B9AC;height:100%;display: flex;justify-content: center;align-items: center;">
                  </div>
                  <!-- <div [innerHTML]="decodeHtml(homework.Title)"></div> -->

                <div style="width: 92%;float: left;background-color: white;padding: 5px;">
                    <p style="font-size:13px;white-space: pre-line;color: black">
                      <b [innerHTML]="decodeHtml(homework.Title)"></b></p>
                    <p style="margin-top: 5px;font-size:11px !important;color:gray;">Apply Date :
                      {{homework.applydate}}</p>
                    <p style="margin-top: 5px;font-size:11px !important;color:gray;">Completion Date :
                      {{homework.completiondate}}</p>
                    <p style="margin-top: 5px;font-size:11px !important;color:gray;">Classes :
                      {{homework.Classes}}</p>

                      <p style="margin-top: 5px;font-size:11px !important;color:gray;">
                        Content :
                        <b [innerHTML]="decodeHtml(homework.details)"></b></p>

                <ion-button fill="clear" size="small" color="primary" (click)="editHomework(homework.homeworkid)" style="float: right;">
                  <ion-icon name="create-outline" slot="icon-only"></ion-icon>
                </ion-button>

                <ion-button fill="clear" size="small" color="danger" (click)="deleteHomework(homework.homeworkid)" style="float: right;">
                  <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
                </ion-button>

                  </div>
                </div>
              </ion-col>
            </ion-row>
          </ng-container>
        </ng-container>
      </ion-list>

    </div>


  </div>




  <ion-list style="background-color: #F0F5F8;" *ngIf="this.status == false">
    <ion-card>
      <ion-item>
        <div style="width:100%;">
          <h5 style="font-size: 11px;"><b>{{this.message}}</b></h5>
        </div>
      </ion-item>
    </ion-card>
  </ion-list>
</ion-content>
