<ion-header>
  <ion-toolbar>
    <ion-title>library</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <br/>
  <div style="width: 100%;">
    <div style="float: left;width: 45%;font-weight: bold;color:#47515b;text-align: center;font-size:15px">Return</div>
  <div style="float: left;font-size:12px;height: 20px;width: 20px;background-color:#90EE90">&nbsp;</div>
<!--second starts-->
<div style="float: left;width: 25%;font-weight: bold;color:#47515b;text-align: center;font-size:15px;text-align:center;padding-left: 25px;">Issued</div>
<div style="float: left;font-size:12px;height: 20px;width: 20px;background-color:#87CEEB;margin-left: 20px;">&nbsp;</div>

<!--second ends-->
</div> 


<div style="width: 100%;">
<div style="float: left;width: 45%;font-weight: bold;color:#47515b;text-align: center;font-size:15px;margin-top: 15px;    margin-bottom: 15px;">Lost/Maintenance</div>
<div style="float: left;font-size:12px;height: 20px;width: 20px;background-color:#FFCCCB;margin-top: 15px;">&nbsp;</div>

<!--second ends-->
</div>
<br/>
<br/>
<br/>
<br/>
<br/>

  <ion-list >

     <ion-item  style="padding-top: 10px"  *ngFor="let books of this.LibraryTransaction">
       <div style="width: 100%;height: 100%;" >
        
                  <!--Submitted-->
         <div *ngIf="books.status == 'A'" style="width: 20%;float: left;background-color: #90EE90;height:100%;display: flex;justify-content: center;align-items: center;">
         <ion-icon name="book" style="color:white;font-size:40px !important;"></ion-icon></div>

         <!--Issued-->
         <div *ngIf="books.status == 'I'"  style="width: 20%;float: left;background-color: #87CEEB;height:100%;display: flex;justify-content: center;align-items: center;">
          <ion-icon name="book" style="color:white;font-size:40px !important;"></ion-icon></div>

          <div *ngIf="books.status == 'M' || books.status == 'L'"  style="width: 20%;float: left;background-color: #FFCCCB;height:100%;display: flex;justify-content: center;align-items: center;">
            <ion-icon name="book" style="color:white;font-size:40px !important;"></ion-icon></div>
        






      <div style="width: 80%;float: left;background-color: #F0F5F8;padding: 7px;">
        <p style="font-size:14px;white-space: pre-line;"><b>{{books.title}} </b></p>
        <p style="margin-top: 5px;font-size:11px !important;">Accession No: {{books.accession_no}}</p>
<p style="margin-top: 5px;font-size:11px !important;">Issue Date: {{books.issue_date}}</p>
<p style="margin-top: 5px;font-size:11px !important;">Due Date:  {{books.due_date}}</p>
<p style="margin-top: 5px;font-size:11px !important;">{{books.remarks}}</p>
<p style="margin-top: 5px;font-size:11px !important;" *ngIf="books.status == 'L' || books.status == 'M'">Fine : {{books.fine_lost * 1 + books.fine_late * 1}}</p>
        
        <p style="margin-top: 5px;font-size:11px !important;" *ngIf="books.status == 'A'" >Return Date:  {{books.return_date}}</p>
        
      </div>

      </div>
      
    </ion-item>


    <ion-item *ngIf="this.status == false" style="margin-top: 10px;">
      <div style="width: 100%;height: 100%;" >
      
            
  <div  style="border-top-left-radius: 12px;
  border-bottom-left-radius: 12px;width: 100%;float: left;height:100%;display: flex;justify-content: center;align-items: center;">
   {{this.message}}
 </div>

  </div>
  </ion-item>
    

    </ion-list>
    
</ion-content>
