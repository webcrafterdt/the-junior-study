<ion-header>
  <ion-toolbar style="background-color: #483f98!important;">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="home"></ion-back-button>
    </ion-buttons>
    <ion-title>Notice</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>


  <ion-grid *ngIf="this.error == false">
  <ion-row justify-content-center style="border-radius: 23px;min-height: 130px;">



    <ion-col  *ngFor="let notice_data of notice;let i =index"     align-self-center size-md="6"  size="5.5" style="    border-bottom-right-radius: 23px;margin-right: 2%;margin-left: 1.3%;margin-bottom: 2%;background-color: #d4f4ff;min-height: 130px;background-color: #d4f4ff;font-size: 15px;text-align: center; font-weight: bold;color: black;height: 40px;padding-top: 11px;">
      <h3 style="color: #483f98;font-size: 12px;">{{notice_data.title}}-</h3>
      <h4 style="color: gray;font-size: 10px;text-align: center;">Categoty : {{notice_data.category}} </h4>
        <span><img src="assets/search.png" style="width:25px;height:25px;" (click)="noticefile(notice_data.description)" /></span>
       
      
     
    </ion-col>
    
  </ion-row>
  </ion-grid>


  <ion-grid  style="flex-wrap: nowrap;
  overflow-x: scroll!important;
  overflow-y: hidden;" class="grid2" *ngIf="this.error != false">
      <ion-row color="primary" justify-content-center  style="flex-wrap: nowrap;
      background-color: #fed4d5;margin-top: 2%;"  >
      <ion-col   align-self-center size-md="6"  size="12" style="font-weight:bold; text-align:center; background-color: #fed4d5;font-size: 12px;color: #483f98;min-height: 40px;padding-top: 11px;">
        {{this.notice.errorMessage}}
       </ion-col>
      </ion-row>

  </ion-grid>
