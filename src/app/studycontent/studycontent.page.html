<ion-list style="background-color: #F0F5F8;" *ngIf="this.status == true">
  <ion-card *ngFor="content of studycontent;let i =index">
  <ion-item>
     <div style="width:100%;">
       <h5 style="font-size: 14px;color: #055073;"><b>{{studycontent[i].StudyContent.title}}</b></h5>
      <h6 style="font-size: 12px;color: gray;">{{studycontent[i].SubjectMaster.name}}</h6>
      <h6 style="font-size: 12px;color: gray;"><b>Post Date </b>: {{studycontent[i][0].from_date}}</h6>
        <h6 style="height: 15px;text-align: center;font-size: 16px;color: #055073;" (click)="contentdetails(i)"><ion-icon name="chevron-down-circle-outline"></ion-icon></h6>
     </div>
  </ion-item>
</ion-card>
