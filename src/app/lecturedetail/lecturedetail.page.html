<ion-header>
  <ion-toolbar style="background-color: #377796!important;">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="lecture"></ion-back-button>
    </ion-buttons>
    <ion-title>Lecture Detail</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content class="ion-padding" style="background-color: #eceff8;">
  <ion-grid  style="flex-wrap: nowrap;
  overflow-x: scroll!important;
  overflow-y: hidden;" class="grid2">
  

    <ion-row color="primary" justify-content-center style="background-color: #d4f4ff;flex-wrap: nowrap;">
      
      <ion-col align-self-center size-md="6"  size="5" style="background-color: #d4f4ff;font-size: 15px;text-align: center; font-weight: bold;color: black;height: 40px;padding-top: 11px;border-right: solid gray 1px;">
        Subject/Topic
      </ion-col>
      <ion-col align-self-center size-md="6"  size="3" style="background-color: #d4f4ff;font-size: 15px;text-align: center;font-weight: bold;color: black;height: 40px;padding-top: 11px;border-right: solid gray 1px;">
        Status
      </ion-col>
      <ion-col align-self-center size-md="6"  size="4" style="background-color: #d4f4ff;font-size: 15px;text-align: center;font-weight: bold;color: black;height: 40px;padding-top: 11px;">
        Time/Date
      </ion-col>
      <!--<ion-col align-self-center size-md="6"  size="4" style="background-color: #d4f4ff;font-size: 15px;text-align: center;font-weight: bold;color: black;height: 40px;padding-top: 11px;">
        Detail
      </ion-col>-->
  
    </ion-row>
  
  
    
    <ion-row color="primary" justify-content-center  style="flex-wrap: nowrap;
    background-color: #fed4d5;margin-top: 2%;" *ngFor="let dummyjso_val of lecturedetails;let i =index">
       <ion-col align-self-center size-md="6"  size="5" style="background-color: #fed4d5;font-size: 10px;color: #483f98;min-height: 40px;padding-top: 11px;border-right: solid gray 1px;">
        {{dummyjso_val.subTopic}}
      </ion-col>
      <ion-col align-self-center size-md="6"  size="3" style="background-color: #fed4d5;font-size: 10px;color: #483f98;min-height: 40px;padding-top: 11px;border-right: solid gray 1px;">
        {{dummyjso_val.facultyName}}
      </ion-col>
      <ion-col align-self-center size-md="6"  size="4" style="background-color: #fed4d5;font-size: 10px;color: #483f98;min-height: 40px;padding-top: 11px;">
        {{dummyjso_val.completedOn}}
      </ion-col>
      <!--<ion-col align-self-center size-md="6" (click)="details(dummyjso_val.action)" size="4" style="text-align:center;background-color: #fed4d5;font-size: 10px;color: #483f98;min-height: 40px;padding-top: 11px;">
        <img src="assets/info.png" style="width:25px;height:25px;" />
      </ion-col>-->
    </ion-row>
  

  
  </ion-grid>
  
</ion-content>
