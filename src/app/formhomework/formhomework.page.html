<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="teacherhome"></ion-back-button>
    </ion-buttons>
    <ion-title>Assign HomeWork</ion-title>
  </ion-toolbar>

  <ion-segment [(ngModel)]="category" style="background-color:#e4f3f7!important">
    <ion-segment-button value="applicationlist" style="border:none;color:black;font-size:12px"
      (click)="applied_leaves()">
      HOMEWORKS
    </ion-segment-button>

  </ion-segment>
</ion-header>

<ion-content>
  <div>

    <!-- <ion-card>
      <quill-editor [(ngModel)]="quillData" (onContentChanged)="onContentChanged($event)"></quill-editor>
    </ion-card> -->

    <ion-card style="background-color: #F0F5F8;">
      <form [formGroup]="ionicForm" novalidate>
        <ion-list style="margin-top: 20px;margin-left: 1%;margin-right: 1%;width: 98%;background-color: #F0F5F8;">


          <ion-item style="margin-top: 5px;">
            <!--<ion-input class="ion-no-padding" name="password" type="password" placeholder="Password" [(ngModel)]="password" required></ion-input>-->
            <textarea placeholder="Title" name="title" type="text" [(ngModel)]="title" formControlName="title"
              style="padding-top:12px;width:100%;border:1px solid #8e9099 !important;height: 40px;color:#8e9099;font-size: 12px;border-radius:25px;
              background-color: white;"
              required></textarea>
            <!-- <ion-input type="text" name="title" [(ngModel)]="title" formcontrolName="title"  placeholder="Title"
              style="border-radius:25px;background-color:white;width:100%;border:1px solid #8e9099 !important;height: 40px;color:#8e9099;font-size: 12px;"
              required></ion-input> -->
          </ion-item>


          <div id="open-modal1" style="    background-color: white;
          width: 90%;margin-left: 5%;height: 39px;
          border: solid gray 1px;border-radius: 20px;margin-top: 10px;padding-left: 5px;">
            <ion-label style="font-size: 12px;padding-left:5px;padding-top: 8px;" *ngIf="!this.dateParts_to">Completion Date</ion-label>
            <ion-text slot="end" name="todate" required style="font-size: 12px;padding-top: 8px;">{{ this.dateParts_to }}</ion-text>
            <ion-icon  name="calendar-outline" style="padding-top: 5px;height: 30px;width: 25px;float: right;padding-right: 10px;"></ion-icon>
          </div>


          <ion-modal [initialBreakpoint]="0.7" trigger="open-modal1">
            <ng-template style="margin-top: 5px;">
              <ion-content>
                <ion-datetime #todatetime presentation="date" name="todate" [(ngModel)]="todate"
                  formControlName="todate" showDefaultButtons="true"
                  (ionChange)="to_date(todatetime.value)"></ion-datetime>
              </ion-content>
            </ng-template>
          </ion-modal>


        </ion-list>
      </form>

      <ion-card style="margin-top: 5px;background-color: #eceff8;">
        <quill-editor [(ngModel)]="quillData" (onContentChanged)="onContentChanged($event)"
          [styles]="{ height: '200px', width: '100%' }" style="background-color: #eceff8;"></quill-editor>
      </ion-card>

      <ion-item style="margin-top: 5px;">
        <ion-button expand="block" class="upload-button" (click)="triggerPdfInput()"
          style="--background: #377796!important; color: #fff;font-size: 10px;" >
          <ion-icon slot="start" name="cloud-upload-outline"></ion-icon>
          Upload Attechment
        </ion-button>


        <p style="font-size: 12px; margin-left: 10px; cursor: pointer;">
          {{ selectedFileNames ? selectedFileNames : '' }}
          
         
       </p>
        <input type="file" id="pdfInput" (change)="onFileSelect($event)" style="display: none;" />
        <!-- <ion-label style="font-size: 12px;padding-left:5px">{{this.attachmentmessage}}</ion-label> -->
      </ion-item>

      <ion-list style="background-color: #eceff8;">
        <ion-button color="background-color: #eceff8;linear-gradient(#007ab3, #055073)" expand="block" size="large" style="border-radius: 5px;height:38px;margin-top:15px;background: linear-gradient(#007ab3, #055073)!important;
      font-size:14px;font-weight:bold;background:linear-gradient(#d8a1c9, #4e79a3)!important;color: white;" type="submit"
          expand="block" (click)="assignhomework()">ASSIGN</ion-button>
      </ion-list>
    </ion-card>

  </div>




  <ion-list style="background-color: #F0F5F8;" *ngIf="this.status == false">
    <ion-card>
      <ion-item>
        <div style="width:100%;">
          <h5 style="font-size: 11px;"><b>{{this.message}}</b></h5>
        </div>
      </ion-item>
    </ion-card>
  </ion-list>
</ion-content>
